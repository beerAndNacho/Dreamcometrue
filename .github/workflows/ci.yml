name: Macro Invest checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --check app/static/app.js && node --check app/static/admin.js && node --check app/static/orbital-v4.js && node --check app/static/kr-market.js && node --check app/static/kr-pulse.js && node --check app/static/kr-insights.js && node --check app/static/kr-pressure.js && node --check app/static/kr-value.js && node --check app/static/intelligence.js && node --check app/static/manual.js && node --check app/static/terminal.js && node --check app/static/terminal-chart.js

      - run: node tools/check_chart_math.cjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m tools.check_terminal_browser ui-checks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terminal-browser-screenshots
          path: ui-checks/
          if-no-files-found: warn
