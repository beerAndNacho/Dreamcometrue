name: Macro Invest checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --check app/static/app.js && node --check app/static/admin.js && node --check app/static/orbital-v4.js && node --check app/static/kr-market.js && node --check app/static/kr-pulse.js && node --check app/static/kr-insights.js && node --check app/static/kr-pressure.js && node --check app/static/kr-value.js && node --check app/static/intelligence.js && node --check app/static/notifications.js && node --check app/static/pwa.js && node --check app/static/sw.js && node --check app/static/journal.js && node --check app/static/operations.js
  postgres-backup:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: macroinvest_ops_test
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_disposable_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d macroinvest_ops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: python -m tools.check_postgres_backup
        env:
          OPS_PG_TEST: '1'
          DATABASE_URL: postgresql+psycopg://ci_user:ci_disposable_password@127.0.0.1:5432/macroinvest_ops_test
